name: Validate Easay
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check application syntax
        run: |
          node --check public/app.js
          node --check public/format.js
          node --check public/plan.js
      - name: Check lessons and API
        run: npm test
      - name: Build the site
        run: npm run build
