name = "easay"
main = "./worker/index.js"
compatibility_date = "2026-11-13"
keep_vars = true

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# After creating D1, add this binding with the REAL database ID from Cloudflare:
[[d1_databases]]
binding = "EASAY_DB"
database_name = "easay-certificates"
database_id = "23202e4e-c1f6-44c1-857b-167d1d580372"
